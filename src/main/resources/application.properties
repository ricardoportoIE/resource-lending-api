spring.application.name=resource-lending-api
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
spring.sql.init.mode=never
api.security.token.secret=${JWT_SECRET}
api.security.token.active-key-id=${JWT_ACTIVE_KID:primary}
api.security.token.keys=${JWT_KEYS:}
api.security.token.access-ttl=PT15M
api.security.token.refresh-ttl=P7D
api.security.token.revocation-cleanup-ms=${JWT_REVOCATION_CLEANUP_MS:3600000}
api.security.login-lock.threshold=${LOGIN_LOCK_THRESHOLD:5}
api.security.login-lock.base-duration=${LOGIN_LOCK_BASE_DURATION:PT1M}
api.security.login-lock.max-duration=${LOGIN_LOCK_MAX_DURATION:PT1H}
api.security.rate-limit.window=${RATE_LIMIT_WINDOW:PT1M}
api.security.rate-limit.requests-per-window=${RATE_LIMIT_REQUESTS:300}
api.security.rate-limit.auth-requests-per-window=${AUTH_RATE_LIMIT_REQUESTS:20}
api.security.identity.confirmation-ttl=${EMAIL_CONFIRMATION_TTL:P1D}
api.security.identity.password-reset-ttl=${PASSWORD_RESET_TTL:PT30M}
api.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
api.reservation.ready-window=${RESERVATION_READY_WINDOW:P2D}
api.reservation.expiry-scan-ms=${RESERVATION_EXPIRY_SCAN_MS:60000}
api.outbox.poll-ms=${OUTBOX_POLL_MS:5000}
api.outbox.batch-size=${OUTBOX_BATCH_SIZE:25}
api.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:5}
api.outbox.retry-base=${OUTBOX_RETRY_BASE:PT30S}
api.notifications.webhook-url=${NOTIFICATION_WEBHOOK_URL:}
api.notifications.due-soon-window=${NOTIFICATION_DUE_SOON_WINDOW:PT24H}
api.notifications.due-soon-scan-ms=${NOTIFICATION_DUE_SOON_SCAN_MS:60000}
api.idempotency.retention=${IDEMPOTENCY_RETENTION:P1D}
api.idempotency.cleanup-ms=${IDEMPOTENCY_CLEANUP_MS:3600000}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.server.port=${MANAGEMENT_SERVER_PORT:8080}
api.observability.internal-metrics=${INTERNAL_METRICS_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.timeout=5s
management.observations.annotations.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Production-oriented resource lending management API
info.app.version=@project.version@
logging.structured.format.console=${LOG_FORMAT:ecs}
