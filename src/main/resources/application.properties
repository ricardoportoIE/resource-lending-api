spring.application.name=resource-lending-api
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
spring.sql.init.mode=never
api.security.token.secret=${JWT_SECRET}
api.security.token.access-ttl=PT15M
api.security.token.refresh-ttl=P7D
api.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
api.reservation.ready-window=${RESERVATION_READY_WINDOW:P2D}
api.reservation.expiry-scan-ms=${RESERVATION_EXPIRY_SCAN_MS:60000}
api.outbox.poll-ms=${OUTBOX_POLL_MS:5000}
api.outbox.batch-size=${OUTBOX_BATCH_SIZE:25}
api.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:5}
api.outbox.retry-base=${OUTBOX_RETRY_BASE:PT30S}
api.notifications.webhook-url=${NOTIFICATION_WEBHOOK_URL:}
api.notifications.due-soon-window=${NOTIFICATION_DUE_SOON_WINDOW:PT24H}
api.notifications.due-soon-scan-ms=${NOTIFICATION_DUE_SOON_SCAN_MS:60000}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Production-oriented resource lending management API
info.app.version=@project.version@
logging.structured.format.console=${LOG_FORMAT:ecs}
