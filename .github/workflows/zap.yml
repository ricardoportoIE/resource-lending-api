name: OWASP ZAP API scan

on:
  schedule:
    - cron: "41 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DB_USERNAME: zap_user
      DB_PASSWORD: zap_ephemeral_password
      JWT_SECRET: zap-ephemeral-signing-secret-at-least-32-characters
      GRAFANA_ADMIN_PASSWORD: zap-ephemeral-grafana-password
      TRACING_SAMPLING_PROBABILITY: "0.0"
    steps:
      - uses: actions/checkout@v7
      - name: Start the ephemeral API
        run: docker compose up --build --detach database jaeger api
      - name: Wait for readiness
        run: |
          for attempt in {1..45}; do
            curl --fail --silent http://127.0.0.1:8081/actuator/health && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Run active OpenAPI scan
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://127.0.0.1:8080/v3/api-docs \
            -f openapi -I -r zap-report.html -J zap-report.json
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-api-scan
          path: zap-reports
          if-no-files-found: warn
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color api database
      - name: Stop ephemeral services
        if: always()
        run: docker compose down --volumes
