services:
  database:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: resource_lending
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://database:5432/resource_lending
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RESERVATION_READY_WINDOW: ${RESERVATION_READY_WINDOW:-P2D}
      RESERVATION_EXPIRY_SCAN_MS: ${RESERVATION_EXPIRY_SCAN_MS:-60000}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-5000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-25}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      OUTBOX_RETRY_BASE: ${OUTBOX_RETRY_BASE:-PT30S}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_DUE_SOON_WINDOW: ${NOTIFICATION_DUE_SOON_WINDOW:-PT24H}
      NOTIFICATION_DUE_SOON_SCAN_MS: ${NOTIFICATION_DUE_SOON_SCAN_MS:-60000}
      IDEMPOTENCY_RETENTION: ${IDEMPOTENCY_RETENTION:-P1D}
      IDEMPOTENCY_CLEANUP_MS: ${IDEMPOTENCY_CLEANUP_MS:-3600000}
      MANAGEMENT_SERVER_PORT: 8081
      INTERNAL_METRICS_ENABLED: "true"
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
    ports:
      - "${APP_PORT:-8080}:8080"
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"
    depends_on:
      database:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
