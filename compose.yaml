services:
  database:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: resource_lending
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://database:5432/resource_lending
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RESERVATION_READY_WINDOW: ${RESERVATION_READY_WINDOW:-P2D}
      RESERVATION_EXPIRY_SCAN_MS: ${RESERVATION_EXPIRY_SCAN_MS:-60000}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-5000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-25}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      OUTBOX_RETRY_BASE: ${OUTBOX_RETRY_BASE:-PT30S}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_DUE_SOON_WINDOW: ${NOTIFICATION_DUE_SOON_WINDOW:-PT24H}
      NOTIFICATION_DUE_SOON_SCAN_MS: ${NOTIFICATION_DUE_SOON_SCAN_MS:-60000}
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
